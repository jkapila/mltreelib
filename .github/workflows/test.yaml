name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  rust:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Tests
        run: cargo test -p mltreelib-core

  python:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    # 3.15 is new: its failures are reported but do not block the run
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Build extension and test
        run: |
          uv sync --group dev --python ${{ matrix.python-version }}
          uv run maturin develop
          uv run pytest tests/ --collect-only -q
          uv run pytest tests/ -q
