[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mltreelib"
version = "0.1.0"
description = "Tree-based machine learning: Rust core with Python and R frontends"
requires-python = ">=3.10"
authors = [{ name = "Jitin Kapila" }]
readme = "README.md"
license = "Apache-2.0"
dependencies = ["pyarrow>=14"]

[project.optional-dependencies]
# Charts and diagrams: the rendering wheels we borrow instead of reinventing.
plotting = [
    "matplotlib>=3.8",
    "pygraphviz>=1.11",
    "seaborn>=0.13",
]
# Hyperparameter search: the Optuna wheel (examples/hpo_optuna.py).
tuning = [
    "optuna>=3.0",
]

[dependency-groups]
dev = [
    "maturin>=1.5,<2.0",
    "pytest>=8",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "ruff>=0.8",
    "zensical>=0.0.67",
]

[tool.maturin]
manifest-path = "crates/mltreelib-py/Cargo.toml"
module-name = "mltreelib._core"
python-source = "python"
features = ["extension-module"]
