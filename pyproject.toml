[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mltreelib"
version = "0.4.16"
description = "Tree-based machine learning: Rust core with Python and R frontends"
requires-python = ">=3.10"
authors = [{ name = "Jitin Kapila" }]
readme = "README.md"
license = "Apache-2.0"
dependencies = []
keywords = [
    "tree",
    "decision-trees",
    "causal-inference",
    "uplift-modeling",
    "model-trees",
    "cubist",
    "c50",
    "interpretable-ml",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/jkapila/mltreelib"
Documentation = "https://jkapila.github.io/mltreelib/"
Repository = "https://github.com/jkapila/mltreelib"
Issues = "https://github.com/jkapila/mltreelib/issues"

[project.optional-dependencies]
# Benchmark dataset loader: reading parquet benchmark suites
dataset = [
    "pyarrow>=14",
]
# Charts and diagrams: the rendering wheels we borrow instead of reinventing.
plotting = [
    "matplotlib>=3.8",
    "pygraphviz>=1.11",
    "seaborn>=0.13",
]
# Hyperparameter search: the Optuna wheel (examples/guides/hpo_optuna.py).
tuning = [
    "optuna>=3.0",
]
# All optional extras combined
all = [
    "pyarrow>=14",
    "matplotlib>=3.8",
    "pygraphviz>=1.11",
    "seaborn>=0.13",
    "optuna>=3.0",
]

[dependency-groups]
dev = [
    "maturin>=1.5,<2.0",
    "pytest>=8",
    "pyarrow>=14",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "ruff>=0.8",
    "zensical>=0.0.67",
]
# Documentation build: renders tree graphs. Needs system Graphviz (libgraphviz-dev).
docs = [
    "pygraphviz>=1.11",
]

[tool.maturin]
manifest-path = "crates/mltreelib-py/Cargo.toml"
module-name = "mltreelib._core"
python-source = "python"
features = ["extension-module"]
include = [
    { path = "examples/quickstart.py", format = "sdist" },
    { path = "benchmarks/suites/*.py", format = "sdist" },
    { path = "skills/mltreelib/**/*", format = "sdist" },
]
