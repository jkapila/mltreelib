site_name: mltreelib
site_url: https://jkapila.github.io/mltreelib/
site_description: Tree-based machine learning with a Rust core
theme:
  variant: modern
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Examples:
      - Churn: examples/churn.md
      - Data Processing: examples/data-processing.md
      - Model building & predictions: examples/model-building.md
      - Inspection: examples/inspection.md
      - Visualization: examples/visualization.md
  - Benchmarks:
      - ELO: benchmarks/elo.md
      - DataSets: benchmarks/datasets.md
  - API reference:
      - Data & Model: reference/data-model.md
plugins:
  - search
  - include-markdown
  - minify:
      minify_html: true
  - llmstxt:
      sections:
        Documentation:
          - index.md
          - installation.md
          - quickstart.md
          - examples/churn.md
          - examples/data-processing.md
          - examples/model-building.md
          - examples/inspection.md
          - examples/visualization.md
          - benchmarks/elo.md
          - benchmarks/datasets.md
          - reference/data-model.md
