site_name: mltreelib
site_url: https://jkapila.github.io/mltreelib/
site_description: Tree-based machine learning with a Rust core
theme:
  variant: modern
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Demo walkthrough: demo.md
  - Benchmark datasets: datasets.md
  - API reference: reference/api.md
plugins:
  - search
  - minify:
      minify_html: true
  - llmstxt:
      sections:
        Documentation:
          - index.md
          - quickstart.md
          - demo.md
          - datasets.md
          - reference/api.md
