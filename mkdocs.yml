site_name: mltreelib
site_url: https://jkapila.github.io/mltreelib/
site_description: Tree-based machine learning with a Rust core
theme:
  variant: modern
  custom_dir: overrides
  logo: assets/mltreelib-icon.svg
  favicon: assets/mltreelib-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
extra_javascript:
  - assets/medium-zoom.min.js
  - assets/zoom-init.js
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Examples:
      - Data:
          - Data Processing: examples/data-processing.md
          - Categorical Encoders: examples/categorical-encoders.md
          - Missing Data & Routing: examples/missing-routing.md
          - Time Series Forecasting: examples/timeseries-forecasting.md
          - Synthetic Controls & Ground Truth: examples/two-controls-and-0d.md
      - ML Models:
          - Supervised & Classical Trees:
              - Model Building & Predictions: examples/model-building.md
              - Growth Knob Tour: examples/knob-tour.md
              - Distributional Leaves: examples/distributional-leaves.md
              - Distributional Split Criteria: examples/distributional-split-criteria.md
              - Causal & Uplift Modeling: examples/causal-uplift.md
              - Tobit & Censored Regression: examples/tobit-regression.md
              - Survival Trees & Hazard Estimation: examples/survival-trees.md
              - Hierarchical Retrain & Routing: examples/hierarchical-retrain.md
              - Monotone & Interaction Constraints: examples/constraints.md
              - Honest Trees & Causal Weights: examples/honesty-weights.md
              - Explainable Stumps & Retrain: examples/stump-explainable.md
              - Rules, Summaries & k-NN: examples/rules-summary-knn.md
              - Hyperparameter Search: examples/hpo.md
          - Clustering:
              - Clustering Comparison: examples/clustering-comparison.md
          - Anomaly Detection:
              - Anomaly Detection Suite: examples/anomaly-comparison.md
      - Metrics & Diagnostics:
          - Metrics & Plots: examples/metrics-plots.md
          - Tree Inspection: examples/inspection.md
          - Visualization: examples/visualization.md
          - End-to-End Walkthrough: examples/walkthrough.md
  - Blog:
      - Overview: blog/index.md
      - Credit Scoring & Glass-Box: blog/why-credit-scoring-needs-glass-box-trees.md
      - Zero-Imputation Maintenance: blog/zero-imputation-predictive-maintenance.md
      - Causal Uplift Modeling: blog/uplift-modeling-with-causal-trees.md
      - Modernizing Quinlan in Rust: blog/modernizing-quinlan-classics-in-rust.md
  - Benchmarks:
      - ELO: benchmarks/elo.md
      - DataSets: benchmarks/datasets.md
  - Research:
      - Field notes: field-notes.md
  - API reference:
      - Overview: reference/api/index.md
      - Data: reference/api/data.md
      - ModelTree: reference/api/model-tree.md
      - Clustering trees: reference/api/cluster.md
      - Anomaly & density trees: reference/api/anomaly.md
      - Metrics: reference/api/metrics.md
      - Encoders & scalers: reference/api/encoders.md
      - Feature functions: reference/api/features.md
      - Data guide: reference/data.md
      - Model guide: reference/model.md
      - Metrics guide: reference/metrics.md
      - Evaluation reports: reference/reports.md
      - Visualization: reference/plots.md
