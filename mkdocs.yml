site_name: mltreelib
site_url: https://jkapila.github.io/mltreelib/
site_description: Tree-based machine learning with a Rust core
theme:
  variant: modern
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
extra_javascript:
  - assets/medium-zoom.min.js
  - assets/zoom-init.js
nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Examples:
      - End-to-end walkthrough: examples/walkthrough.md
      - Data Processing: examples/data-processing.md
      - Model building & predictions: examples/model-building.md
      - Growth knob tour: examples/knob-tour.md
      - Distributional leaves: examples/distributional-leaves.md
      - Categorical encoders: examples/categorical-encoders.md
      - Monotone & interaction constraints: examples/constraints.md
      - Inspection: examples/inspection.md
      - Visualization: examples/visualization.md
      - Metrics & plots: examples/metrics-plots.md
      - Hyperparameter search: examples/hpo.md
  - Benchmarks:
      - ELO: benchmarks/elo.md
      - DataSets: benchmarks/datasets.md
  - Research:
      - Field notes: field-notes.md
  - API reference:
      - Overview: reference/api/index.md
      - Data: reference/api/data.md
      - ModelTree: reference/api/model-tree.md
      - Metrics: reference/api/metrics.md
      - Encoders & scalers: reference/api/encoders.md
      - Feature functions: reference/api/features.md
      - Data guide: reference/data.md
      - Model guide: reference/model.md
      - Metrics guide: reference/metrics.md
      - Evaluation reports: reference/reports.md
      - Visualization: reference/plots.md
plugins:
  - search
  - include-markdown
  - minify:
      minify_html: true
  - llmstxt:
      sections:
        Documentation:
          - index.md
          - installation.md
          - quickstart.md
          - examples/walkthrough.md
          - examples/data-processing.md
          - examples/model-building.md
          - examples/knob-tour.md
          - examples/distributional-leaves.md
          - examples/categorical-encoders.md
          - examples/constraints.md
          - examples/inspection.md
          - examples/visualization.md
          - examples/metrics-plots.md
          - examples/hpo.md
          - benchmarks/elo.md
          - benchmarks/datasets.md
          - field-notes.md
          - reference/data.md
          - reference/model.md
          - reference/metrics.md
          - reference/reports.md
          - reference/plots.md
          - reference/api/index.md
          - reference/api/data.md
          - reference/api/model-tree.md
          - reference/api/metrics.md
          - reference/api/encoders.md
          - reference/api/features.md
