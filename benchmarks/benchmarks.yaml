# Benchmark manifest. `publish: true` entries are shown on the site and must have
# a narrated page, a results file and a reproduce command (scripts/docs/check_benchmarks.py).
# Everything else is an internal regression check and stays off the site.

- id: elo-arena
  script: benchmarks/arena/elo_score_all.py
  title: "Elo arena: 56 datasets, 47 entrants"
  page: benchmarks/elo.md
  verifies: "Accuracy and speed of mltreelib against peer libraries on TabArena-v0.1 (OpenML suite 457)"
  reproduce: uv run python -u benchmarks/arena/elo_score_all.py
  results:
    - benchmarks/elo_scores.csv
    - benchmarks/elo_cla_scores.csv
  publish: true
- id: regression-methods
  script: benchmarks/suites/regression_methods_showcase.py
  title: "Regression methods across real datasets"
  page: benchmarks/regression-methods.md
  verifies: "Huber, quantile, expectile, NNLS and group-lasso GAM against baselines"
  reproduce: uv run python -u benchmarks/suites/regression_methods_showcase.py
  results:
    - docs/snippets/outputs/regression_methods_showcase.txt
  publish: true
