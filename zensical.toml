[project]
site_name = "mltreelib v0.4.14"
site_url = "https://jkapila.github.io/mltreelib/"
site_description = "Tree-based machine learning with a Rust core"
repo_url = "https://github.com/jkapila/mltreelib"
repo_name = "jkapila/mltreelib"
exclude_docs = """
agents/*
examples/visualization.md
reference/plots.md
"""

extra_css = [
  "assets/custom.css",
]

extra_javascript = [
  "assets/medium-zoom.min.js",
  "assets/zoom-init.js",
  "assets/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Quickstart" = "quickstart.md" },
  { "Releases" = "https://github.com/jkapila/mltreelib/releases" },
  { "Suites" = [
    { "Overview" = "suites/index.md" },
    { "Suite 1: Core Architecture & Growth Knobs" = "suites/core-tree-architecture.md" },
    { "Suite 2: Structural Constraints & Honesty" = "suites/constraints-and-honesty.md" },
    { "Suite 3: Native Missing Data Routing" = "suites/missing-data-routing.md" },
    { "Suite 4: Distributional & Censored Leaves" = "suites/distributional-leaves.md" },
    { "Suite 5: Dynamic Leaf Retraining" = "suites/hierarchical-retrain.md" },
    { "Suite 6: Statistical & Metric Splitting" = "suites/statistical-and-metric-splitting.md" },
    { "Suite 7: Time Series Forecasting" = "suites/timeseries-forecasting.md" },
    { "Suite 8: Unsupervised Trees" = "suites/unsupervised-trees.md" },
    { "Suite 9: Survival & Competing Risks Trees" = "suites/survival-trees.md" },
    { "Suite 10: Solvers, Optimizers & Real-Data Tuning" = "suites/solver-benchmarks.md" },
    { "Suite 11: Component & Factor Analysis" = "suites/component-benchmarks.md" },
  ] },
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "Data & Metrics" = [
      { "Data Ingestion & Missing Routing" = "examples/data-matrix-and-routing.md" },
      { "Metrics, Diagnostics & Calibration" = "examples/metrics-plots.md" },
      { "PCA Rotations & Simple Structure" = "examples/pca-rotations.md" },
    ] },
    { "Regression & Continuous Models" = [
      { "Comprehensive Regression Showcase" = "examples/regression-methods-showcase.md" },
      { "Piecewise Linear Trees & Cubist Rules" = "examples/piecewise-linear-and-cubist.md" },
      { "Distributional & Censored Trees" = "examples/distributional-and-censored-trees.md" },
    ] },
    { "Causal & Unsupervised" = [
      { "Causal Uplift & Treatment Effects" = "examples/causal-uplift.md" },
      { "Unsupervised Clustering & Anomalies" = "examples/unsupervised-clustering-and-anomalies.md" },
    ] },
    { "Architecture, Inspection & Tuning" = [
      { "Tree Architecture, Growth Knobs & Constraints" = "examples/tree-architecture-and-knobs.md" },
      { "Model Inspection, Rules & Stumps" = "examples/model-inspection-and-rules.md" },
      { "Generic Solvers & Hyperparameter Tuning" = "examples/optimization-and-tuning.md" },
    ] },
  ] },
  { "Blog" = [
    { "Overview" = "blog/index.md" },
    { "Prescriptive Replenishment" = "blog/prescriptive-inventory-replenishment.md" },
    { "Two-Stage Survival Trees" = "blog/segregate-first-two-stage-survival-trees.md" },
    { "Credit Scoring and Trees" = "blog/why-credit-scoring-needs-glass-box-trees.md" },
    { "Causal Uplift Modeling" = "blog/uplift-modeling-with-causal-trees.md" },
    { "Zero-Imputation Maintenance" = "blog/zero-imputation-predictive-maintenance.md" },
  ] },
  { "Benchmarks" = [
    { "Overview" = "benchmarks/elo.md" },
    { "Overall Arena" = "benchmarks/elo_overall.md" },
    { "Regression Arena" = "benchmarks/elo_board.md" },
    { "Classification Arena" = "benchmarks/elo_cla_board.md" },
    { "Datasets" = "benchmarks/datasets.md" },
  ] },
  { "Research" = [
    { "Field notes" = "field-notes.md" },
  ] },
  { "API reference" = [
    { "Overview" = "reference/api/index.md" },
    { "Parameters Catalog" = "reference/parameters.md" },
    { "Data" = "reference/api/data.md" },
    { "ModelTree" = "reference/api/model-tree.md" },
    { "Clustering trees" = "reference/api/cluster.md" },
    { "Anomaly & density trees" = "reference/api/anomaly.md" },
    { "Component & factor analysis" = "reference/api/components.md" },
    { "Rule-set models" = "reference/api/rules.md" },
    { "Model reports & diagnostics" = "reference/api/report.md" },
    { "Metrics" = "reference/api/metrics.md" },
    { "Encoders & scalers" = "reference/api/encoders.md" },
    { "Feature functions" = "reference/api/features.md" },
    { "Solvers & optimization" = "reference/api/solvers.md" },
    { "Rust generic seam" = "reference/api/rust-generic.md" },
    { "Data guide" = "reference/data.md" },
    { "Model guide" = "reference/model.md" },
    { "Metrics guide" = "reference/metrics.md" },
    { "Evaluation reports" = "reference/reports.md" },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "assets/mltreelib-icon.svg"
favicon = "assets/mltreelib-icon.svg"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
  "content.tabs.link",
  "content.footnote.tooltips",
  "content.tooltips",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

