      { "Survival" = "guides/survival.md" },
      { "Uplift" = "guides/uplift.md" },
      { "Clustering" = "guides/clustering.md" },
      { "Anomaly detection" = "guides/anomaly.md" },
      { "Evaluate and monitor" = "guides/evaluation.md" },
      { "Visualization" = "guides/visualization.md" },
      { "Serving contract" = "guides/serving-contract.md" },
      { "Extend a model tree" = "guides/advanced-modeling.md" },
      { "Get the real datasets" = "guides/real-data.md" },
    ] },
    { "How it works" = [
      { "Tree architecture and growth knobs" = "guides/core-tree-architecture.md" },
      { "Constraints and honesty" = "guides/constraints-and-honesty.md" },
      { "Native missing-data routing" = "guides/missing-data-routing.md" },
      { "Distributional and censored leaves" = "guides/distributional-leaves.md" },
      { "Leaf retraining and micro-models" = "guides/hierarchical-retrain.md" },
      { "Statistical and metric splitting" = "guides/statistical-and-metric-splitting.md" },
      { "Time series forecasting" = "guides/timeseries-forecasting.md" },
      { "Clustering trees" = "guides/clustering-trees.md" },
      { "Anomaly trees" = "guides/anomaly-trees.md" },
      { "Survival and competing risks" = "guides/survival-trees.md" },
      { "Solvers and optimizers" = "guides/solvers-and-optimizers.md" },
      { "Components and rotations" = "guides/components-and-rotations.md" },
    ] },
    { "Worked examples" = [
      { "Data ingestion and missing routing" = "guides/data-matrix-and-routing.md" },
      { "Metrics, diagnostics and calibration" = "guides/metrics-plots.md" },
      { "Regression methods showcase" = "guides/regression-methods-showcase.md" },
      { "Piecewise linear trees and Cubist rules" = "guides/piecewise-linear-and-cubist.md" },
      { "Architecture, knobs and constraints" = "guides/tree-architecture-and-knobs.md" },
      { "Inspection, rules and stumps" = "guides/model-inspection-and-rules.md" },
    ] },
  ] },
  { "Blog" = [
    { "Overview" = "blog/index.md" },
    { "Prescriptive Replenishment" = "blog/prescriptive-inventory-replenishment.md" },
    { "Two-Stage Survival Trees" = "blog/segregate-first-two-stage-survival-trees.md" },
    { "Credit Scoring and Trees" = "blog/why-credit-scoring-needs-glass-box-trees.md" },
    { "Causal Uplift Modeling" = "blog/uplift-modeling-with-causal-trees.md" },
